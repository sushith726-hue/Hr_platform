services:
  db:
    image: postgres:15-alpine
    container_name: talentstream_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: talentstream
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentstream"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentstream_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: talentstream_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build: .
    container_name: talentstream_ai_worker
    # FIX 4: Also consume audio-worker queue so BB6 (generate_report) always has a consumer
    # even if queue routing is later changed back. Belt-and-suspenders.
    command: celery -A backend.workers.tasks.celery_app worker -Q ai-worker,audio-worker --loglevel=info -n ai-worker@%h
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  audio-worker:
    build: .
    container_name: talentstream_audio_worker
    # FIX 4: Also consume ai-worker queue as redundancy
    command: celery -A backend.workers.tasks.celery_app worker -Q audio-worker,ai-worker --loglevel=info -n audio-worker@%h
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: talentstream_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpass
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: talentstream_mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpass;
      /usr/bin/mc mb myminio/livekit-bucket || true;
      /usr/bin/mc anonymous set public myminio/livekit-bucket || true;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
